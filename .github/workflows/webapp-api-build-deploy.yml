name: Web App - Build and Deploy to App Service

on:
  workflow_dispatch:
  push:
    branches: [ Dev ]
    paths:
      - 'webapp/**'
      - 'frontend/webapp/**'
      - 'infra/webapp-api.bicep'
      - 'infra/webapp-api-README.md'
      - '.github/workflows/webapp-api-build-deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
      LOCATION: 'uksouth'
      APPSERVICE_NAME: ${{ secrets.APPSERVICE_NAME }}
      APPSERVICE_PLAN: ${{ secrets.APPSERVICE_PLAN }}
      CEAPI_CONTAINER_GROUP: ${{ secrets.CEAPI_CONTAINER_GROUP }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Azure login using service principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Look up CEAPI endpoint
        id: ceapi
        shell: bash
        run: |
          fqdn=$(az container show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CEAPI_CONTAINER_GROUP" \
            --query "ipAddress.fqdn" -o tsv)
          if [ -z "$fqdn" ]; then
            echo "Could not resolve CEAPI container FQDN; is $CEAPI_CONTAINER_GROUP deployed?" >&2
            exit 1
          fi
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/webapp/package-lock.json

      - name: Build frontend
        shell: bash
        working-directory: frontend/webapp
        run: |
          npm ci
          npm run build

      - name: Copy frontend build into Atlas.Web.Api/wwwroot
        shell: bash
        run: |
          rm -rf webapp/src/Atlas.Web.Api/wwwroot
          mkdir -p webapp/src/Atlas.Web.Api/wwwroot
          cp -r frontend/webapp/dist/. webapp/src/Atlas.Web.Api/wwwroot/

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: webapp/src/global.json

      - name: Publish Atlas.Web.Api
        shell: bash
        run: |
          dotnet publish webapp/src/Atlas.Web.Api/Atlas.Web.Api.csproj \
            -c Release \
            -o publish \
            --no-self-contained

      - name: Zip publish output
        shell: bash
        run: |
          cd publish
          zip -r ../webapp-api.zip . -x '*.pdb'

      - name: Preview App Service deployment
        shell: bash
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/webapp-api.bicep \
            --parameters \
              location="$LOCATION" \
              prefix='atlas' \
              appServiceName="$APPSERVICE_NAME" \
              appServicePlanName="$APPSERVICE_PLAN" \
              iceEndpoint="${{ steps.ceapi.outputs.fqdn }}"

      - name: Deploy App Service infrastructure
        shell: bash
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/webapp-api.bicep \
            --parameters \
              location="$LOCATION" \
              prefix='atlas' \
              appServiceName="$APPSERVICE_NAME" \
              appServicePlanName="$APPSERVICE_PLAN" \
              iceEndpoint="${{ steps.ceapi.outputs.fqdn }}"

      - name: Deploy app package
        shell: bash
        run: |
          az webapp deploy \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APPSERVICE_NAME" \
            --src-path webapp-api.zip \
            --type zip

      - name: Show App Service state
        if: ${{ success() }}
        shell: bash
        run: |
          az webapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APPSERVICE_NAME" \
            --query "{state:state, defaultHostName:defaultHostName}" \
            --output table
