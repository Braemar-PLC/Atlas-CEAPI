name: CEAPI - Build and Deploy to ACI

on:
  workflow_dispatch:
  push:
    branches: [ Dev ]
    paths:
      - 'CEAPI/**'
      - 'infra/ceapi-aci.bicep'
      - 'infra/ceapi-aci-README.md'
      - '.github/workflows/ceapi-aci-build-deploy.yml'

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    env:
      ACR_NAME: ${{ secrets.ACR_NAME }}
      RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
      LOCATION: 'uksouth'
      CEAPI_CONTAINER_GROUP: ${{ secrets.CEAPI_CONTAINER_GROUP }}
      CEAPI_IMAGE_TAG: ${{ github.sha }}
      ICE_HOST: ${{ secrets.ICE_HOST }}
      ICE_USERNAME: ${{ secrets.ICE_USERNAME }}
      ICE_PASSWORD: ${{ secrets.ICE_PASSWORD }}
      ICE_SYMBOLS: ${{ secrets.ICE_SYMBOLS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Azure login using service principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure ACR exists
        shell: pwsh
        run: |
          az acr show -n "$env:ACR_NAME" -g "$env:RESOURCE_GROUP" 1>$null 2>$null
          if ($LASTEXITCODE -ne 0) {
            az acr create `
              --name "$env:ACR_NAME" `
              --resource-group "$env:RESOURCE_GROUP" `
              --location "$env:LOCATION" `
              --sku Basic `
              --admin-enabled true | Out-Null
          }

      - name: Validate CEAPI build context
        shell: pwsh
        run: |
          $requiredFiles = @(
            'CEAPI/Dockerfile.windows',
            'CEAPI/build.gradle',
            'CEAPI/gradlew.bat',
            'CEAPI/gradle/wrapper/gradle-wrapper.jar',
            'CEAPI/lib/ICEesig-jstandard-api-1.31.1.1.jar',
            'CEAPI/lib/ICEesig-jstandard-dbcjna-1.31.1.1.jar',
            'CEAPI/lib/jna-3.5.2.jar',
            'CEAPI/lib/platform-3.5.2.jar',
            'CEAPI/bin/PortLib_64VC17.dll',
            'CEAPI/bin/dbcapi_64VC17.dll'
          )
          foreach ($path in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required build artifact missing: $path"
            }
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'

      - name: Set up Gradle 9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.0.0'

      - name: Build CEAPI distribution
        shell: pwsh
        run: |
          gradle --project-dir CEAPI --no-daemon installDist -x test
          if ($LASTEXITCODE -ne 0) {
            throw "Gradle installDist failed with exit code $LASTEXITCODE"
          }

          $runtimeFiles = @(
            'CEAPI/build/install/ceapi/bin/ceapi.bat',
            'CEAPI/build/install/ceapi/lib/ceapi-1.0-SNAPSHOT.jar'
          )
          foreach ($path in $runtimeFiles) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required CEAPI runtime artifact missing after Gradle build: $path"
            }
          }

      - name: Build and push CEAPI Windows image with ACR Tasks
        shell: pwsh
        run: |
          az acr build `
            --registry "$env:ACR_NAME" `
            --platform Windows `
            --image "ceapi:$env:CEAPI_IMAGE_TAG" `
            --file CEAPI/Dockerfile.windows `
            CEAPI
          if ($LASTEXITCODE -ne 0) {
            throw "ACR Windows image build failed with exit code $LASTEXITCODE"
          }

      - name: Preview ACI deployment
        shell: pwsh
        run: |
          $image = "$env:ACR_NAME.azurecr.io/ceapi:$env:CEAPI_IMAGE_TAG"
          az deployment group what-if `
            --resource-group "$env:RESOURCE_GROUP" `
            --template-file infra/ceapi-aci.bicep `
            --parameters `
              location="$env:LOCATION" `
              acrName="$env:ACR_NAME" `
              prefix='atlas' `
              containerImage="$image" `
              ceapiContainerGroupName="$env:CEAPI_CONTAINER_GROUP" `
              iceHost="$env:ICE_HOST" `
              iceUsername="$env:ICE_USERNAME" `
              icePassword="$env:ICE_PASSWORD" `
              symbols="$env:ICE_SYMBOLS"

      - name: Deploy ACI container group
        id: deploy
        shell: pwsh
        run: |
          $image = "$env:ACR_NAME.azurecr.io/ceapi:$env:CEAPI_IMAGE_TAG"
          az deployment group create `
            --resource-group "$env:RESOURCE_GROUP" `
            --template-file infra/ceapi-aci.bicep `
            --parameters `
              location="$env:LOCATION" `
              acrName="$env:ACR_NAME" `
              prefix='atlas' `
              containerImage="$image" `
              ceapiContainerGroupName="$env:CEAPI_CONTAINER_GROUP" `
              iceHost="$env:ICE_HOST" `
              iceUsername="$env:ICE_USERNAME" `
              icePassword="$env:ICE_PASSWORD" `
              symbols="$env:ICE_SYMBOLS"

      - name: Show CEAPI container state
        if: ${{ success() }}
        shell: pwsh
        run: |
          az container show `
            --resource-group "$env:RESOURCE_GROUP" `
            --name "$env:CEAPI_CONTAINER_GROUP" `
            --query "{state:instanceView.state, ip:ipAddress.ip, fqdn:ipAddress.fqdn}" `
            --output table

      - name: Show CEAPI container logs on failure
        if: ${{ failure() && steps.deploy.outcome == 'failure' }}
        shell: pwsh
        run: |
          az container logs `
            --resource-group "$env:RESOURCE_GROUP" `
            --name "$env:CEAPI_CONTAINER_GROUP"
