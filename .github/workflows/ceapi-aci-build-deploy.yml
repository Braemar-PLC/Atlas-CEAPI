name: CEAPI - Build and Deploy to ACI

on:
  workflow_dispatch:
  push:
    branches: [ Dev ]
    paths:
      - 'CEAPI/**'
      - 'infra/ceapi-aci.bicep'
      - 'infra/ceapi-aci-README.md'
      - '.github/workflows/ceapi-aci-build-deploy.yml'

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    env:
      ACR_NAME: ${{ secrets.ACR_NAME }}
      RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
      LOCATION: 'uksouth'
      CEAPI_CONTAINER_GROUP: ${{ secrets.CEAPI_CONTAINER_GROUP }}
      APPSERVICE_NAME: ${{ secrets.APPSERVICE_NAME }}
      CEAPI_IMAGE_TAG: ${{ github.sha }}
      ICE_HOST: ${{ secrets.ICE_HOST }}
      ICE_USERNAME: ${{ secrets.ICE_USERNAME }}
      ICE_PASSWORD: ${{ secrets.ICE_PASSWORD }}
      ICE_SYMBOLS: ${{ secrets.ICE_SYMBOLS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Azure login using service principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Prevent accidental ACI deployment after ACA cutover
        shell: pwsh
        run: |
          $backend = az webapp config appsettings list `
            --resource-group "$env:RESOURCE_GROUP" --name "$env:APPSERVICE_NAME" `
            --query "[?name=='CEAPI_BACKEND'].value | [0]" --output tsv
          if ($LASTEXITCODE -ne 0) { throw 'Could not check selected CEAPI backend.' }
          if ($backend -eq 'aca') { throw 'ACA is selected. Roll back explicitly before deploying ACI.' }

      - name: Ensure ACR exists
        shell: pwsh
        run: |
          az acr show -n "$env:ACR_NAME" -g "$env:RESOURCE_GROUP" 1>$null 2>$null
          if ($LASTEXITCODE -ne 0) {
            az acr create `
              --name "$env:ACR_NAME" `
              --resource-group "$env:RESOURCE_GROUP" `
              --location "$env:LOCATION" `
              --sku Basic `
              --admin-enabled true | Out-Null
          }

      - name: Validate CEAPI build context
        shell: pwsh
        run: |
          $requiredFiles = @(
            'CEAPI/Dockerfile.windows',
            'CEAPI/build.gradle',
            'CEAPI/gradlew.bat',
            'CEAPI/gradle/wrapper/gradle-wrapper.jar',
            'CEAPI/lib/ICEesig-jstandard-api-1.31.1.1.jar',
            'CEAPI/lib/ICEesig-jstandard-dbcjna-1.31.1.1.jar',
            'CEAPI/lib/jna-3.5.2.jar',
            'CEAPI/lib/platform-3.5.2.jar',
            'CEAPI/bin/PortLib_64VC17.dll',
            'CEAPI/bin/dbcapi_64VC17.dll'
          )
          foreach ($path in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required build artifact missing: $path"
            }
          }

          $symbols = @($env:ICE_SYMBOLS -split ',' | ForEach-Object { $_.Replace('"', '').Trim() } | Where-Object { $_ } | Select-Object -Unique)
          if ($symbols.Count -eq 0) {
            throw 'ICE_SYMBOLS must contain at least one non-blank symbol.'
          }
          Write-Host "Configured $($symbols.Count) unique environment-variable symbols; no automatic expansion."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'

      - name: Set up Gradle 9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.0.0'

      - name: Build CEAPI distribution
        shell: pwsh
        run: |
          # The unit tests read settings from the environment, so they must not see this job's real ICE values.
          Remove-Item Env:ICE_HOST, Env:ICE_USERNAME, Env:ICE_PASSWORD, Env:ICE_SYMBOLS -ErrorAction SilentlyContinue
          gradle --project-dir CEAPI --no-daemon test installDist
          if ($LASTEXITCODE -ne 0) {
            throw "Gradle test/installDist failed with exit code $LASTEXITCODE"
          }

          $runtimeFiles = @(
            'CEAPI/build/install/ceapi/bin/ceapi.bat',
            'CEAPI/build/install/ceapi/lib/ceapi-1.0-SNAPSHOT.jar'
          )
          foreach ($path in $runtimeFiles) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required CEAPI runtime artifact missing after Gradle build: $path"
            }
          }

      - name: Build and push CEAPI Windows image with ACR Tasks
        shell: pwsh
        run: |
          az acr build `
            --registry "$env:ACR_NAME" `
            --platform Windows `
            --image "ceapi:$env:CEAPI_IMAGE_TAG" `
            --file CEAPI/Dockerfile.windows `
            CEAPI
          if ($LASTEXITCODE -ne 0) {
            throw "ACR Windows image build failed with exit code $LASTEXITCODE"
          }

      - name: Preview ACI deployment
        shell: pwsh
        run: |
          $image = "$env:ACR_NAME.azurecr.io/ceapi:$env:CEAPI_IMAGE_TAG"
          az deployment group what-if `
            --name "ceapi-aci-whatif-${{ github.run_id }}" `
            --resource-group "$env:RESOURCE_GROUP" `
            --template-file infra/ceapi-aci.bicep `
            --parameters `
              location="$env:LOCATION" `
              acrName="$env:ACR_NAME" `
              prefix='atlas' `
              containerImage="$image" `
              ceapiContainerGroupName="$env:CEAPI_CONTAINER_GROUP" `
              iceHost="$env:ICE_HOST" `
              iceUsername="$env:ICE_USERNAME" `
              icePassword="$env:ICE_PASSWORD" `
              symbols="$env:ICE_SYMBOLS" `
              vnetName='BraemarSecurities-Development-VNET'

      - name: Deploy ACI container group
        id: deploy
        shell: pwsh
        run: |
          # ACI does not allow an existing container group to move from a public
          # IP to a VNet subnet. The CEAPI group is an Atlas-owned application
          # resource, so recreate this group after the what-if has passed.
          az container delete `
            --resource-group "$env:RESOURCE_GROUP" `
            --name "$env:CEAPI_CONTAINER_GROUP" `
            --yes `
            --output none `
            2>$null

          $image = "$env:ACR_NAME.azurecr.io/ceapi:$env:CEAPI_IMAGE_TAG"
          az deployment group create `
            --name "ceapi-aci-${{ github.run_id }}" `
            --resource-group "$env:RESOURCE_GROUP" `
            --template-file infra/ceapi-aci.bicep `
            --parameters `
              location="$env:LOCATION" `
              acrName="$env:ACR_NAME" `
              prefix='atlas' `
              containerImage="$image" `
              ceapiContainerGroupName="$env:CEAPI_CONTAINER_GROUP" `
              iceHost="$env:ICE_HOST" `
              iceUsername="$env:ICE_USERNAME" `
              icePassword="$env:ICE_PASSWORD" `
              symbols="$env:ICE_SYMBOLS" `
              vnetName='BraemarSecurities-Development-VNET'

      - name: Point the Web App at the private CEAPI address
        shell: pwsh
        run: |
          $privateIp = az container show `
            --resource-group "$env:RESOURCE_GROUP" `
            --name "$env:CEAPI_CONTAINER_GROUP" `
            --query "ipAddress.ip" `
            --output tsv
          if ([string]::IsNullOrWhiteSpace($privateIp)) {
            throw 'The private CEAPI IP address was not assigned.'
          }
          az webapp config appsettings set `
            --resource-group "$env:RESOURCE_GROUP" `
            --name "$env:APPSERVICE_NAME" `
            --settings "Ice__Endpoint=$privateIp"

      - name: Show CEAPI container state
        if: ${{ success() }}
        shell: pwsh
        run: |
          az container show `
            --resource-group "$env:RESOURCE_GROUP" `
            --name "$env:CEAPI_CONTAINER_GROUP" `
            --query "{state:instanceView.state, ip:ipAddress.ip, fqdn:ipAddress.fqdn}" `
            --output table

      - name: Show CEAPI container logs on failure
        if: ${{ failure() && steps.deploy.outcome == 'failure' }}
        shell: pwsh
        run: |
          az container logs `
            --resource-group "$env:RESOURCE_GROUP" `
            --name "$env:CEAPI_CONTAINER_GROUP"
