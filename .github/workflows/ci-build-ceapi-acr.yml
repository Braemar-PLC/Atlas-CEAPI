name: CI - Build CEAPI and push to ACR

on:
  push:
    paths:
      - 'CEAPI/**'
    branches: [ 'Dev' ]

jobs:
  build-and-push:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    env:
      ACR_NAME: ${{ secrets.ACR_NAME }}
      RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure ACR name
        shell: pwsh
        run: |
          az acr show -n "$env:ACR_NAME" --resource-group "$env:RESOURCE_GROUP" | Out-Null

      - name: Validate CEAPI build context
        shell: pwsh
        run: |
          $requiredFiles = @(
            'CEAPI/Dockerfile.windows',
            'CEAPI/build.gradle',
            'CEAPI/gradlew.bat',
            'CEAPI/gradle/wrapper/gradle-wrapper.jar',
            'CEAPI/bin/PortLib_64VC17.dll',
            'CEAPI/bin/dbcapi_64VC17.dll'
          )
          foreach ($path in $requiredFiles) {
            if (-not (Test-Path $path)) {
              throw "Required build artifact missing: $path"
            }
          }

      - name: Login to ACR
        shell: pwsh
        run: |
          az acr login --name "$env:ACR_NAME"

      - name: Build image locally on Windows runner
        shell: pwsh
        run: |
          $image = "$env:ACR_NAME.azurecr.io/ceapi:${{ github.sha }}"
          docker build --pull -f CEAPI/Dockerfile.windows -t $image CEAPI

      - name: Push image to ACR
        shell: pwsh
        run: |
          $image = "$env:ACR_NAME.azurecr.io/ceapi:${{ github.sha }}"
          docker push $image

      - name: Set output image
        id: image
        shell: pwsh
        run: |
          $image = "$env:ACR_NAME.azurecr.io/ceapi:${{ github.sha }}"
          "image=$image" >> $env:GITHUB_OUTPUT
          Set-Content -Path ceapi-image.txt -Value $image

      - name: Upload image info
        uses: actions/upload-artifact@v4
        with:
          name: ceapi-image
          path: ceapi-image.txt
