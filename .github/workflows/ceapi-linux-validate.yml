name: CEAPI - Validate Linux image

on:
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the validated image to the existing ACR (no deployment)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Check configured subscriptions before publishing
        if: ${{ inputs.publish_image }}
        env:
          ICE_SYMBOLS: ${{ secrets.ICE_SYMBOLS }}
        run: |
          python - <<'PY'
          import os
          symbols = {s.replace('"', '').strip() for s in os.environ["ICE_SYMBOLS"].split(",")}
          symbols.discard("")
          if not symbols:
              raise SystemExit("ICE_SYMBOLS must contain at least one non-blank symbol")
          print(f"CONFIGURED_SYMBOL_COUNT={len(symbols)}")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test and package CEAPI
        working-directory: CEAPI
        run: bash gradlew --no-daemon test installDist
      - name: Build Linux amd64 image
        run: docker build --platform linux/amd64 -f CEAPI/Dockerfile.linux -t ceapi-linux:validation CEAPI
      - name: Validate actual ICE native loader without network access
        run: |
          timeout 60 docker run --rm --network none ceapi-linux:validation \
            java -Djna.library.path=/app/native -cp '/app/lib/*' /app/validation/LinuxNativeSmoke.java
      - name: Validate relay startup without ICE credentials or external networking
        shell: bash
        run: |
          docker run -d --name ceapi-linux-validation --network none \
            -e ICE_HOST=validation.invalid \
            -e ICE_USERNAME=offline-validation \
            -e ICE_PASSWORD=offline-validation \
            -e SYMBOLS=OFFLINE-VALIDATION \
            ceapi-linux:validation
          timeout 90 docker exec ceapi-linux-validation java /app/validation/LinuxRelaySmoke.java
      - name: Azure login for approved image publishing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_image }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Publish validated image and verify registry digest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_image }}
        shell: bash
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          registry=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)
          if [ -z "$registry" ]; then
            echo "::error::Existing ACR login server could not be resolved."
            exit 1
          fi
          image="$registry/ceapi-linux:$GITHUB_SHA"
          az acr login --name "$ACR_NAME"
          docker tag ceapi-linux:validation "$image"
          docker push "$image"
          digest=$(az acr repository show --name "$ACR_NAME" \
            --image "ceapi-linux:$GITHUB_SHA" --query digest --output tsv)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Published manifest digest is missing or invalid."
            exit 1
          fi
          docker pull "$registry/ceapi-linux@$digest"
          timeout 60 docker run --rm --network none "$registry/ceapi-linux@$digest" \
            java -Djna.library.path=/app/native -cp '/app/lib/*' /app/validation/LinuxNativeSmoke.java
          {
            echo "## Validated Linux image published"
            echo
            echo "- Image: \`$image\`"
            echo "- Immutable reference: \`$registry/ceapi-linux@$digest\`"
            echo "- Native SDK smoke test passed against the published digest."
            echo "- No Azure application was deployed or restarted."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PUBLISHED_IMAGE=$image"
          echo "PUBLISHED_DIGEST=$digest"
      - name: Show validation logs and clean up
        if: always()
        shell: bash
        run: |
          if docker container inspect ceapi-linux-validation >/dev/null 2>&1; then
            docker logs ceapi-linux-validation
            docker rm -f ceapi-linux-validation
          fi
