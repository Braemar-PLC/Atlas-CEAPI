name: CEAPI - Show container logs

# Manual diagnostic workflow: dumps the current CEAPI container logs without touching the
# build/deploy pipeline. Use this to inspect ICE connection status (IceConnectionManager logs
# "ICE connecting...", "ICE connected: <host>", or "ICE error: <status>" on every attempt).
on:
  workflow_dispatch:

jobs:
  show-logs:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
      CEAPI_CONTAINER_GROUP: ${{ secrets.CEAPI_CONTAINER_GROUP }}

    steps:
      - name: Azure login using service principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Show CEAPI container state
        shell: bash
        run: |
          az container show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CEAPI_CONTAINER_GROUP" \
            --query "{state:instanceView.state, ip:ipAddress.ip, fqdn:ipAddress.fqdn, events:containers[0].instanceView.events}" \
            --output json

      - name: Show CEAPI container logs (az container logs — not supported for Windows containers, expect empty)
        shell: bash
        run: |
          az container logs \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CEAPI_CONTAINER_GROUP" || true

      - name: Query CEAPI stdout/stderr from Log Analytics
        shell: bash
        run: |
          az extension add -n log-analytics --only-show-errors || true
          WORKSPACE_ID=$(az monitor log-analytics workspace show \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name atlas-law \
            --query customerId -o tsv)
          echo "Workspace customer id: $WORKSPACE_ID"
          echo "--- Table names available ---"
          az monitor log-analytics query \
            --workspace "$WORKSPACE_ID" \
            --analytics-query "search * | distinct \$table | take 50" \
            --output table || true
          echo "--- ContainerInstanceLog_CL (last 500 lines, most recent first) ---"
          az monitor log-analytics query \
            --workspace "$WORKSPACE_ID" \
            --analytics-query "ContainerInstanceLog_CL | order by TimeGenerated desc | take 500 | order by TimeGenerated asc | project TimeGenerated, Message" \
            --output tsv || true
