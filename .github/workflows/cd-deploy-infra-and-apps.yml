name: CD - Deploy infra and apps

on:
  workflow_dispatch:
  push:
    branches: [ 'dev' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
      ACR_NAME: ${{ secrets.ACR_NAME }}
      WEBAPP_NAME: ${{ secrets.WEBAPP_NAME }}
      STATIC_WEBAPP_NAME: ${{ secrets.STATIC_WEBAPP_NAME }}
      STATIC_WEBAPP_API_TOKEN: ${{ secrets.STATIC_WEBAPP_API_TOKEN }}
      CEAPI_IMAGE: ${{ secrets.CEAPI_IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build frontend and deploy to Static Web App
        if: ${{ env.STATIC_WEBAPP_NAME != '' }}
        run: |
          cd frontend/webapp
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps (if configured)
        if: ${{ env.STATIC_WEBAPP_API_TOKEN != '' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.STATIC_WEBAPP_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'frontend/webapp'
          output_location: 'frontend/webapp/dist'
