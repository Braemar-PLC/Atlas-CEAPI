name: CD - Deploy infra and apps

on:
  workflow_dispatch:
  push:
    branches: [ 'main' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep (infrastructure)
        env:
          RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
          CEAPI_IMAGE: ${{ secrets.CEAPI_IMAGE }} # e.g. '<acr>.azurecr.io/ceapi:tag'
        run: |
          az deployment group create -g $RESOURCE_GROUP --template-file infra/main.bicep --parameters prefix='atlas' location=$(az group show -n $RESOURCE_GROUP --query location -o tsv) containerImage=$CEAPI_IMAGE

      - name: Build and deploy .NET API to App Service
        env:
          RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
          WEBAPP_NAME: ${{ secrets.WEBAPP_NAME }}
        run: |
          cd webapp/src
          dotnet publish Atlas.Web.Api/Atlas.Web.Api.csproj -c Release -o publish
          # Zip the publish folder for deployment
          cd Atlas.Web.Api
          zip -r ../api_publish.zip publish

      - name: Deploy API to App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.WEBAPP_NAME }}
          slot-name: Production
          package: webapp/src/Atlas.Web.Api/api_publish.zip

      - name: Build frontend and deploy to Static Web App
        if: ${{ secrets.STATIC_WEBAPP_NAME != '' }}
        env:
          STATIC_WEBAPP_NAME: ${{ secrets.STATIC_WEBAPP_NAME }}
        run: |
          cd frontend/webapp
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps (if configured)
        if: ${{ secrets.STATIC_WEBAPP_API_TOKEN != '' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.STATIC_WEBAPP_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'frontend/webapp'
          output_location: 'frontend/webapp/dist'
