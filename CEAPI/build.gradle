plugins {
    id 'java'
    id 'application'
    id 'jacoco'
}

group = 'com.example'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'com.braemar.ceapi.Main'

    applicationDefaultJvmArgs = [
        "-Djna.library.path=${projectDir}/bin"
    ]

}

repositories {
    mavenCentral()
}

dependencies {
    // dotenv for environment variable management
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'
    // WebSocket server — battle-tested RFC 6455 implementation
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    // CEAPI JARs — ICEesig-jstandard-api/-dbcjna plus the third-party jars ICE ships
    // alongside them (Apache Commons, Jackson, JNA, org.json). Vendored as-is from the
    // ICE SDK distribution rather than resolved from Maven, since the JStandard API is
    // built/tested against these exact jar versions.
    implementation fileTree(dir: "${projectDir}/lib", include: ['*.jar'])
    implementation 'org.slf4j:slf4j-simple:2.0.13'
    // Log4j2 — required by the JStandard API per its SDK README, but not bundled in the
    // SDK's third-party folder (it's plain open-source, so pulled from Maven Central
    // instead of vendoring). log4j-jcl transitively pulls in commons-logging, which
    // duplicates the commons-logging-1.3.4.jar already vendored in CEAPI/lib, so it's
    // excluded here to avoid a Gradle "duplicate jar entry" failure in installDist.
    implementation 'org.apache.logging.log4j:log4j-api:2.24.2'
    implementation 'org.apache.logging.log4j:log4j-core:2.24.2'
    implementation('org.apache.logging.log4j:log4j-jcl:2.24.2') {
        exclude group: 'commons-logging', module: 'commons-logging'
    }

    // Test
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testImplementation 'uk.org.webcompere:system-stubs-jupiter:2.1.6'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// log4j-jcl (added below) pulls in its own commons-logging jar, which duplicates the
// commons-logging-1.3.4.jar already vendored in CEAPI/lib; without an explicit strategy,
// Gradle 9's installDist copy task fails outright on any duplicate archive entry.
tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jacocoTestReport {
    reports {
        html.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/Main.class'])
        }))
    }
}

test {
    useJUnitPlatform {
        excludeTags 'integration'
    }
    testLogging {
        events "failed", "skipped"
        exceptionFormat "full"
        showStandardStreams false
    }
    finalizedBy jacocoTestReport
}

tasks.register('integrationTest', Test) {
    useJUnitPlatform {
        includeTags 'integration'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    jvmArgs "-Djna.library.path=${projectDir}/bin"

    // ALWAYS show stdout/stderr for integration tests
    testLogging {
        // NOTE: pass as varargs, not a list
        events 'passed', 'skipped', 'failed', 'standardOut', 'standardError'
        showStandardStreams = true
        exceptionFormat 'full'
    }

    // Load .env into process env
    def envFile = file("${projectDir}/.env")
    if (envFile.exists()) {
        envFile.eachLine { line ->
            line = line.trim()
            if (line && !line.startsWith('#')) {
                def idx = line.indexOf('=')
                if (idx > 0) {
                    def key = line.substring(0, idx).trim()
                    def value = line.substring(idx + 1).trim()
                    environment(key, value)
                }
            }
        }
    }
}

