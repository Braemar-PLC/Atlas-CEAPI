# ====================================================================================
# NewsSample Configuration
# This file defines the settings used by the NewsSample application.
# ====================================================================================

# ------------------------------------------------------------------------------------
# Application Metadata
# ------------------------------------------------------------------------------------
# Version of the NewsSample application
samples.newssample.version=5/13/2025

# Build number for this version
samples.newssample.build=1

# Path to the help file used for displaying usage instructions
samples.helpFile=/NewsManager/NewsSample/help.txt

# ------------------------------------------------------------------------------------
# Network and Connection Settings
# ------------------------------------------------------------------------------------
# Enable/disable proxy support
# Set to true if a proxy server is required to connect to the ICE Data Services network.
# Set to false to connect directly without a proxy.
samples.connection.useproxy=false

# Proxy server hostname
samples.connection.proxyhost=

# Proxy server port
samples.connection.proxyport=

# Proxy username (if required)
samples.connection.proxyusername=

# Proxy password (if required)
samples.connection.proxypassword=

# Use Amazon Web Services client
# Set to true to enable the AWS client for connecting to ICE Data Services.
# Set to false to use the default client.
samples.connection.useAWS=false

# TLS Modes for Connections
# 0 : SOCKTYPE_LEGACY    Non-TLS (insecure) connection
# 1 : SOCKTYPE_TLS       TLS-encrypted (secure) connection
# 2 : SOCKTYPE_TLS_PLUS  Reserved for future use
#
# Note: Secure (TLS) connections require an account with entitlement 1023. 
#       Any attempt to connect securely to the ICE Data Services network 
#       without this entitlement will fail.
samples.connection.tls.mode=0

# Hostname of the ICE Data Services News Feed Network
samples.connection.host=cm*.dataservices.theice.com

# ------------------------------------------------------------------------------------
# Request Settings
# ------------------------------------------------------------------------------------
# Request Type
# Specify the type of request: "request", "subscribe", or "story".
# - request: Retrieve a one-time set of data.
# - subscribe: Continuously receive updates as new data becomes available.
# - story: Fetch a specific story using the storyID.
samples.newssample.requesttype=request

# Time limit for running the sample before stopping
# Specify the maximum runtime for the sample. Format: HH:MM:SS.
# Use 0 to run continuously until manually stopped.
samples.newssample.timeLimit=0

# Story ID for requesting a specific story
samples.newssample.storyID=

# Story Format
# Specify the format of the retrieved story:
# - 5: URL
# - 3: HTML
samples.newssample.storyFormat=5

# Subscribe to all headline update actions
# Set to true to receive all headline update actions during a subscription request.
# Note: When true, the requestType is assumed to be "subscribe".
# Set to false to limit updates to standard actions only.
samples.newssample.subscribeAllActions=false

# Number of past headlines to return
# Specify the number of historical headlines to retrieve.
# Use a value > 0 to enable historical searching. Results may be split across multiple messages.
samples.newssample.headlineCount=50

# Sort Order
# Specify the order in which results are returned:
# - 0: Descending
# - 1: Ascending
# - 2: By relevance score
samples.newssample.sortOrder=0

# News Services to search
# Leave blank to search across all available services.
samples.newssample.services=

# ------------------------------------------------------------------------------------
# Symbol Configuration
# ------------------------------------------------------------------------------------
# Instruments to search
# Provide a comma-separated list of symbols to search for news headlines.
# Example: GOOG,TSLA,ICE,IBM,MSFT,NVDA
samples.newssample.symbols=GOOG,TSLA,ICE,IBM,MSFT,NVDA

# Categories to search
# Provide a comma-separated list of categories to filter the search.
# Example: financials,consumer-goods
samples.newssample.categories=financials,consumer-goods

# ------------------------------------------------------------------------------------
# Date/Time Settings
# ------------------------------------------------------------------------------------
# Begin time to search
# Specify the oldest time to start the search.
# Format: yyyy/MM/dd HH:mm:ss or 0 for unlimited.
samples.newssample.beginTime=0

# End time to search
# Specify the most recent time to end the search.
# Format: yyyy/MM/dd HH:mm:ss or 0 for the current time.
samples.newssample.endTime=0

# Days of headlines to search
# Specify the number of days to search for headlines.
# Use 0 for unlimited days.
samples.newssample.headlineDays=0

# ------------------------------------------------------------------------------------
# Search Options
# ------------------------------------------------------------------------------------
# Text search value
# Specify the text to search for. This can include partial words, whole words, phrases, or boolean expressions.
samples.newssample.search=

# Full-text search query
# Set to true if the search should include full-text query capabilities.
# Set to false for standard search behavior.
samples.newssample.fullTextQuery=false

# Fields to search
# Specify the fields to search within:
# - 1: HEADLINE
# - 2: ALL
# - 4: STORYTEXT
# - 8: CATEGORIES
# - 16: SYMBOLS
samples.newssample.searchFields=8

# Match all words in the search text
# Set to true to match all words specified in the "search" property (AND logic).
# Set to false to match any word specified (OR logic).
samples.newssample.matchAllWords=false

# Treat search text as an exact phrase
# Set to true to treat the search text as an exact phrase.
# Set to false to allow partial matches.
samples.newssample.phraseQuery=false

# Match the whole word or phrase
# Set to true to return results that match the entire word or phrase in the search text.
# Set to false to allow partial matches.
samples.newssample.matchWholeWord=false

# Case-sensitive search
# Set to true to match the case of the search text exactly.
# Set to false to perform case-insensitive searches.
samples.newssample.matchCase=false

# ------------------------------------------------------------------------------------
# Display Settings
# ------------------------------------------------------------------------------------
# Display format
# Specify how the results are displayed:
# - ON: Display results in the console.
# - OFF: Output results to a CSV file.
samples.newssample.display=ON
