# ====================================================================================
# StockOptionRootSample Configuration
# This file defines the settings used by the StockOptionRootSample application.
# ====================================================================================

# ------------------------------------------------------------------------------------
# Application Metadata
# ------------------------------------------------------------------------------------
# Version of the StockOptionRootSample application
samples.stockoptionrootsample.version=5/13/2025

# Build number for this version
samples.stockoptionrootsample.build=1

# Path to the help file used for displaying usage instructions
samples.helpFile=/QuoteManager/StockOptionRootSample/help.txt

# ------------------------------------------------------------------------------------
# Network and Connection Settings
# ------------------------------------------------------------------------------------
# Enable/disable proxy support
# Set to true if a proxy server is required to connect to the ICE Data Services network.
# Set to false to connect directly without a proxy.
samples.connection.useproxy=false

# Proxy server hostname
samples.connection.proxyhost=

# Proxy server port
samples.connection.proxyport=

# Proxy username (if required)
samples.connection.proxyusername=

# Proxy password (if required)
samples.connection.proxypassword=

# Use Amazon Web Services client
# Set to true to enable the AWS client for connecting to ICE Data Services.
# Set to false to use the default client.
samples.connection.useAWS=false

# TLS Modes for Connections
# 0 : SOCKTYPE_LEGACY    Non-TLS (insecure) connection
# 1 : SOCKTYPE_TLS       TLS-encrypted (secure) connection
# 2 : SOCKTYPE_TLS_PLUS  Reserved for future use
#
# Note: Secure (TLS) connections require an account with entitlement 1023. 
#       Any attempt to connect securely to the ICE Data Services network 
#       without this entitlement will fail.
samples.connection.tls.mode=0

# Hostname of the ICE Data Services Network
samples.connection.host=cm*.dataservices.theice.com

# ------------------------------------------------------------------------------------
# Request Settings
# ------------------------------------------------------------------------------------
# Time limit for running the sample before stopping
# Specify the maximum runtime for the sample. Format: HH:MM:SS.
# Use 0 to run continuously until manually stopped.
samples.stockoptionrootsample.timeLimit=0

# ------------------------------------------------------------------------------------
# Symbol Configuration
# ------------------------------------------------------------------------------------
# Specify a single symbol or multiple symbols separated by commas
samples.stockoptionrootsample.symbols=IBM,ICE,AAPL

# ------------------------------------------------------------------------------------
# Display Settings
# ------------------------------------------------------------------------------------
# Display format
# Specify how the results are displayed:
# - ON: Display results in the console.
# - OFF: Output results to a CSV file.
samples.stockoptionrootsample.display=ON