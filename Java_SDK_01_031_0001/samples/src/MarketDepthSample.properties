# ====================================================================================
# MarketDepthSample Configuration
# This file defines the settings used by the MarketDepthSample application.
# ====================================================================================

# ------------------------------------------------------------------------------------
# Application Metadata
# ------------------------------------------------------------------------------------
# Version of the MarketDepthSample application
samples.marketdepthsample.version=5/13/2025
# Build number for this version
samples.marketdepthsample.build=1

# Path to the help file used for displaying usage instructions
samples.helpFile=/MarketDepthManager/MarketDepthSample/help.txt

# ------------------------------------------------------------------------------------
# Network and Connection Settings
# ------------------------------------------------------------------------------------
# Enable/disable proxy support
# Set to true if a proxy server is required to connect to the ICE Data Services network.
# Set to false to connect directly without a proxy.
samples.connection.useproxy=false

# Proxy server hostname
samples.connection.proxyhost=

# Proxy server port
samples.connection.proxyport=

# Proxy username (if required)
samples.connection.proxyusername=

# Proxy password (if required)
samples.connection.proxypassword=

# Use Amazon Web Services client
# Set to true to enable the AWS client for connecting to ICE Data Services.
# Set to false to use the default client.
samples.connection.useAWS=false

# TLS Modes for Connections
# 0 : SOCKTYPE_LEGACY    Non-TLS (insecure) connection
# 1 : SOCKTYPE_TLS       TLS-encrypted (secure) connection
# 2 : SOCKTYPE_TLS_PLUS  Reserved for future use
#
# Note: Secure (TLS) connections require an account with entitlement 1023. 
#       Any attempt to connect securely to the ICE Data Services network 
#       without this entitlement will fail.
samples.connection.tls.mode=0

# Hostname of the ICE Data Services Market Depth Network
samples.connection.host=cm*.dataservices.theice.com

# ------------------------------------------------------------------------------------
# Inquiry Settings
# ------------------------------------------------------------------------------------
# Symbols to inquire about
# Provide a comma-separated list of symbols for market depth information.
# Example: IBM,GOOG,MSFT
samples.marketdepthsample.symbols=IBM

# Turnaround value for requests
# Specify the turnaround ID to track requests and responses.
samples.marketdepthsample.turnaround=2001

# Use default settings
# Set to true to use default values for optional parameters.
# Set to false to explicitly specify all parameter values.
samples.marketdepthsample.usedefault=false

# Inquiry mode
# Specify the mode of the inquiry:
# - info: Retrieve security information.
# - stream: Receive streaming updates for market depth data.
samples.marketdepthsample.mode=info

# Time limit for running the sample before stopping
# Specify the maximum runtime for the sample. Format: HH:MM:SS.
# Use 0 to run continuously until manually stopped.
samples.marketdepthsample.timeLimit=0

# ------------------------------------------------------------------------------------
# Filter and Depth Type Settings
# ------------------------------------------------------------------------------------
# Market depth filter
# Specify the filter for the market depth data:
# -1 : DEFAULT (no filter applied)
#  1 : BOARDLOT_ONLY (board lot orders only)
#  2 : ODDLOT_ONLY (odd lot orders only)
samples.marketdepthsample.filter=-1

# Depth type
# Specify the type of market depth data to retrieve:
# -1 : DEFAULT (no specific depth type)
#  1 : ORDER_BOOK (order book data)
#  2 : BOOK_BY_PRICE (data grouped by price)
#  3 : BOOK_BY_MARKET_PARTICIPANT (data grouped by market participant)
#  4 : BOOK_BY_LEVEL (data by level depth)
#  5 : BOOK_BY_MARKET_PARTICIPANT_EXTENDED (TotalView data)
samples.marketdepthsample.depthtype=-1

