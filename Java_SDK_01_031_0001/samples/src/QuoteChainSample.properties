# ====================================================================================
# QuoteChainSample Configuration
# This file defines the settings used by the QuoteChainSample application.
# ====================================================================================

# ------------------------------------------------------------------------------------
# Application Metadata
# ------------------------------------------------------------------------------------
# Version of the QuoteChainSample application
samples.quotechainsample.version=5/13/2025

# Build number for this version
samples.quotechainsample.build=1

# Path to the help file used for displaying usage instructions
samples.helpFile=/QuoteManager/QuoteChainSample/help.txt

# ------------------------------------------------------------------------------------
# Network and Connection Settings
# ------------------------------------------------------------------------------------
# Enable/disable proxy support
# Set to true if a proxy server is required to connect to the ICE Data Services network.
# Set to false to connect directly without a proxy.
samples.connection.useproxy=false

# Proxy server hostname
samples.connection.proxyhost=

# Proxy server port
samples.connection.proxyport=

# Proxy username (if required)
samples.connection.proxyusername=

# Proxy password (if required)
samples.connection.proxypassword=

# Use Amazon Web Services client
# Set to true to enable the AWS client for connecting to ICE Data Services.
# Set to false to use the default client.
samples.connection.useAWS=false

# TLS Modes for Connections
# 0 : SOCKTYPE_LEGACY    Non-TLS (insecure) connection
# 1 : SOCKTYPE_TLS       TLS-encrypted (secure) connection
# 2 : SOCKTYPE_TLS_PLUS  Reserved for future use
#
# Note: Secure (TLS) connections require an account with entitlement 1023. 
#       Any attempt to connect securely to the ICE Data Services network 
#       without this entitlement will fail.
samples.connection.tls.mode=0

# Hostname of the ICE Data Services Network
samples.connection.host=cm*.dataservices.theice.com

# ------------------------------------------------------------------------------------
# Request Settings
# ------------------------------------------------------------------------------------
# Snapshot request behavior
# Set to true to emulate a snapshot by unsubscribing each symbol received in the chain request.
# Set to false to stream the chain continuously (default behavior).
samples.quotechainsample.snapshotRequest=false

# Chain type for the inquiry
# Specify the type of options chain to retrieve:
# - STOCK_OPTIONS: Retrieve stock options chain.
# - FUTURE_OPTIONS: Retrieve futures options chain.
# - FUTURE_CHAIN: Retrieve futures chain.
samples.quotechainsample.chaintype=STOCK_OPTIONS

# Month filter for the inquiry
# Specify a month to filter options:
#  0-11 : Specify the month (0 for January, 11 for December).
# -1    : No month filter applied.
# Note: Not applicable if chaintype is FUTURE_CHAIN.
samples.quotechainsample.monthfilter=-1

# Year filter for the inquiry
# Specify a year to filter options:
# yyyy : Specify the year (e.g., 2024).
#  -1  : No year filter applied.
# Note: Not applicable if chaintype is FUTURE_CHAIN.
samples.quotechainsample.yearfilter=-1

# Put/Call filter for the inquiry
# Specify whether to filter by puts, calls, or no filter:
#  put  : Filter by put options.
#  call : Filter by call options.
#  -1   : No put/call filter applied.
# Note: Not applicable if chaintype is FUTURE_CHAIN.
samples.quotechainsample.putcallfilter=-1

# Strike price filtering
# Specify minimum and maximum strike prices:
#  nn   : Specify the price as a whole number.
#  -1   : No price filter applied.
samples.quotechainsample.minstrike=-1
samples.quotechainsample.maxstrike=-1

# Time limit for running the sample before stopping
# Specify the maximum runtime for the sample. Format: HH:MM:SS.
# Use 0 to run continuously until manually stopped.
samples.quotechainsample.timeLimit=0

# ------------------------------------------------------------------------------------
# Symbol Configuration
# ------------------------------------------------------------------------------------
# Specify a single symbol or multiple symbols separated by commas
# Symbols to inquire about
# Provide a comma-separated list of underlyers for the quote chain inquiry.
# Example: O:AAPL,O:MSFT,O:GOOGL
samples.quotechainsample.symbols=O:AAPL


# Specify a file containing a list of symbols (one per line)
samples.quotechainsample.symbollist=

# ------------------------------------------------------------------------------------
# Display Settings
# ------------------------------------------------------------------------------------
# Display format
# Specify how the results are displayed:
# - ON: Display results in the console.
# - OFF: Output results to a CSV file.
samples.quotechainsample.display=ON