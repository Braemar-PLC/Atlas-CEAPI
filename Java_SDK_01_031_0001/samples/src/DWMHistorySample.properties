# ====================================================================================
# DWMHistorySample Configuration
# This file defines the settings used by the DWMHistorySample application.
# ====================================================================================

# ------------------------------------------------------------------------------------
# Application Metadata
# ------------------------------------------------------------------------------------
# Version of the DWMHistorySample application
samples.histsample.version=5/13/2025

# Build number for this version
samples.histsample.build=1

# Path to the help file used for displaying usage instructions
samples.helpFile=/HistoryManager/DWMHistory/help.txt

# ------------------------------------------------------------------------------------
# Network and Connection Settings
# ------------------------------------------------------------------------------------
# Enable/disable proxy support (true/false)
samples.connection.useproxy=false

# Proxy server hostname
samples.connection.proxyhost=

# Proxy server port
samples.connection.proxyport=

# Proxy username (if required)
samples.connection.proxyusername=

# Proxy password (if required)
samples.connection.proxypassword=

# Use Amazon Web Services client (true/false)
samples.connection.useAWS=false

# TLS Modes for Connections
# 0 : SOCKTYPE_LEGACY    Non-TLS (insecure) connection
# 1 : SOCKTYPE_TLS       TLS-encrypted (secure) connection
# 2 : SOCKTYPE_TLS_PLUS  Reserved for future use
#
# Note: Secure (TLS) connections require an account with entitlement 1023. 
#       Any attempt to connect securely to the ICE Data Services network 
#       without this entitlement will fail.
samples.connection.tls.mode=0

# Hostname of the ICE Data Services Consolidated Feed Network
samples.connection.host=cm*.dataservices.theice.com

# ------------------------------------------------------------------------------------
# Request Settings
# ------------------------------------------------------------------------------------
# Request Mode: "history" or "dictionary"
samples.histsample.mode=history

# Version of the client-cached Flexible Data dictionary (0 for full update)
samples.histsample.dictionaryVersion=0

# ------------------------------------------------------------------------------------
# Symbol Configuration
# ------------------------------------------------------------------------------------
# Specify a single symbol or multiple symbols separated by commas
samples.histsample.symbols=ICE

# Specify a file containing a list of symbols (one per line)
samples.histsample.symbollist=

# ------------------------------------------------------------------------------------
# Date/Time Settings
# ------------------------------------------------------------------------------------
# Start date for the historical data request (format: yyyy/MM/dd)
samples.histsample.beginDate=2025/1/1

# End date for the historical data request (format: yyyy/MM/dd)
samples.histsample.endDate=2025/1/16

# ------------------------------------------------------------------------------------
# Options
# ------------------------------------------------------------------------------------
# Specify options for this request (e.g., CURRENCY=GBP,NBARS=5)
# For a complete list of options, refer to the help file that accompanies this application,
# or visit the ICE Data Services Developer Center at https://developer.theice.com
samples.histsample.options=

# Specify bar interval (DAILY, WEEKLY, MONTHLY, QUARTERLY, YEARLY, FOURMONTHS,  THREEWEEKS, TWODAYS)
samples.histsample.interval=DAILY

# Specify the back adjustment value
samples.histsample.adjustmentValue=

# ------------------------------------------------------------------------------------
# Display Settings
# ------------------------------------------------------------------------------------
# Display format for the received data (ON for console display, OFF for CSV output)
samples.histsample.display=ON
