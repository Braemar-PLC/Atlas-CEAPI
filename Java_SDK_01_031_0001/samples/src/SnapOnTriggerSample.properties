# ====================================================================================
# SnapOnTriggerSample Configuration
# This file defines the settings used by the SnapOnTriggerSample application.
# ====================================================================================

# ------------------------------------------------------------------------------------
# Application Metadata
# ------------------------------------------------------------------------------------
# Version of the SnapOnTriggerSample application
samples.snapontrigger.version=5/13/2025

# Build number for this version
samples.snapontrigger.build=1

# Path to the help file used for displaying usage instructions
samples.helpFile=/TriggeredQuoteManager/SnapOnTriggerSample/help.txt

# ------------------------------------------------------------------------------------
# Network and Connection Settings
# ------------------------------------------------------------------------------------
# Enable/disable proxy support
# Set to true if a proxy server is required to connect to the ICE Data Services network.
# Set to false to connect directly without a proxy.
samples.connection.useproxy=false

# Proxy server hostname
samples.connection.proxyhost=

# Proxy server port
samples.connection.proxyport=

# Proxy username (if required)
samples.connection.proxyusername=

# Proxy password (if required)
samples.connection.proxypassword=

# Use Amazon Web Services client
# Set to true to enable the AWS client for connecting to ICE Data Services.
# Set to false to use the default client.
samples.connection.useAWS=false

# TLS Modes for Connections
# 0 : SOCKTYPE_LEGACY    Non-TLS (insecure) connection
# 1 : SOCKTYPE_TLS       TLS-encrypted (secure) connection
# 2 : SOCKTYPE_TLS_PLUS  Reserved for future use
#
# Note: Secure (TLS) connections require an account with entitlement 1023. 
#       Any attempt to connect securely to the ICE Data Services network 
#       without this entitlement will fail.
samples.connection.tls.mode=0

# Hostname of the ICE Data Services Network
samples.connection.host=cm*.dataservices.theice.com

# ------------------------------------------------------------------------------------
# Request Settings
# ------------------------------------------------------------------------------------
# Inquiry mode
# Specify the mode for the SnapOnTrigger inquiry:
# - addTrigger: Adds each defined trigger to the Snap-on-Trigger service.
# - shortList: Lists the names of all active triggers.
# - detailedList: Lists all active triggers along with their details.
samples.snapontrigger.mode=shortList

# Time limit for running the sample before stopping
# Specify the maximum runtime for the sample. Format: HH:MM:SS.
# Use 0 to run continuously until manually stopped.
samples.snapontrigger.timeLimit=0

# ------------------------------------------------------------------------------------
# Trigger Configurations
# ------------------------------------------------------------------------------------
# This sample allows the client to specify a single trigger definition from the command-line
# or multiple triggers from this properties file.
# If the user provides a triggerName and one or more field IDs from the command-line the
# sample will use those settings instead of values found in this file.

# Number of Triggers
# Indicates how many triggers to activate in this sample.
# This number must not exceed the total number of defined triggers below.
# For example, even if 3 triggers are defined, setting this to 1 activates only the first.
samples.snapontrigger.numTriggers=1

# Trigger Definitions
# Define each trigger with a unique name, ID, type, symbols, and fields.
# A trigger JSON document can be no larger than 32 KB.

samples.snapontrigger.trigger1={"triggerName":"YES DART Price","triggerID":1,"triggerType":"field","symbols":["10002381088-YES","116013753-YES"],"fields":[2938,2939,2940]}
samples.snapontrigger.trigger2={"triggerName":"Ask Price","triggerID":2,"triggerType":"field","symbols":["IBM","ICE","GOOG","TSLA","VOD-LON"],"fields":[21]}
samples.snapontrigger.trigger3={"triggerName":"52WK High","triggerID":3,"triggerType":"field","symbols":["NVDA","$INDU","$COMPQ"],"fields":[50]}

# List Requests
# Define parameters for listing active triggers:
# - SHORT LIST: {"version": "1.0","request": {"requestType": "listTriggers","params": {"detailed": false}}}
# - DETAILED LIST: {"version": "1.0","request": {"requestType": "listTriggers","params": {"detailed": true}}}
samples.snapontrigger.list={"version": "1.0","request": {"requestType": "listTriggers","params": {"detailed": 
samples.snapontrigger.short=false}}}
samples.snapontrigger.detailed=true}}}

# ------------------------------------------------------------------------------------
# Symbol Configuration
# ------------------------------------------------------------------------------------
# A "symbollist" file takes precedence over a "symbols" setting.
# This sample allows the client to supply either a set of symbols or a file name from
# the command-line.  Command-line values override the values found in this properties
# file.

# Specify a single symbol or multiple symbols separated by commas
samples.snapontrigger.symbols=ICE

# Specify a file containing a list of symbols (one per line)
samples.snapontrigger.symbollist=

# ------------------------------------------------------------------------------------
# Display Settings
# ------------------------------------------------------------------------------------
# Display format
# Specify how the results are displayed:
# - ON: Display results in the console.
# - OFF: Output results to a CSV file.
samples.snapontrigger.display=ON